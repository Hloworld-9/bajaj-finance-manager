    <!-- MAIN APP JAVASCRIPT & FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, setDoc, getDoc, where, orderBy, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3hc6Rz1gHZq8c71AHp5NSw8eSZT2-Mik", 
            authDomain: "savitri-job-bridge.firebaseapp.com", 
            projectId: "savitri-job-bridge", 
            storageBucket: "savitri-job-bridge.firebasestorage.app", 
            messagingSenderId: "721066136910", 
            appId: "1:721066136910:web:61b5d58b31d8ab481f7a1f"
        };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        // Global Variable for Real Stock to be accessible everywhere
        let globalRealStock = [];

        // ================= UI SWITCHING & SECURITY =================
        window.switchTab = function(tabId, titleText) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            let activeNavItem = Array.from(document.querySelectorAll('.nav-item')).find(item => item.getAttribute('onclick') && item.getAttribute('onclick').includes(tabId));
            if(activeNavItem) activeNavItem.classList.add('active');
            
            document.getElementById('top-title').innerText = titleText;
            window.scrollTo(0, 0);
            if(tabId === 'tab-gst' && window.scaleInvoice) window.scaleInvoice();
        };

        let systemPin = "1234"; 
        const pinRef = doc(db, "app_settings", "security");
        
        async function fetchPin() { 
            const docSnap = await getDoc(pinRef); 
            if (docSnap.exists()) systemPin = docSnap.data().pin; 
            else await setDoc(pinRef, { pin: "1234" }); 
        }
        fetchPin();
        
        window.verifyPin = function() { 
            if(document.getElementById('pinInput').value === systemPin) { 
                document.getElementById('lockScreen').style.display = 'none'; 
                document.getElementById('mainApp').style.display = 'block'; 
            } else { 
                alert("❌ Incorrect PIN."); 
                document.getElementById('pinInput').value = ''; 
            } 
        };
        
        window.changePin = async function() { 
            if(prompt("Enter Current PIN:") === systemPin) { 
                const newPin = prompt("Enter NEW 4-digit PIN:"); 
                if(newPin && newPin.length >= 4) { 
                    await setDoc(pinRef, { pin: newPin }); 
                    systemPin = newPin; 
                    alert("✅ PIN Changed!"); 
                } else alert("PIN must be at least 4 digits."); 
            } else alert("❌ Wrong PIN."); 
        };

        // ================= 🖼️ IMAGE VIEWER LOGIC =================
        window.closeImageModal = function() { 
            document.getElementById('imageModal').style.display = 'none'; 
            document.getElementById('modalImageSrc').src = ''; 
        };
        
        window.viewPurchasePhoto = function(id) {
            if(!window.globalPurchaseBills) return;
            let bill = window.globalPurchaseBills.find(b => b.id === id);
            if(bill && bill.photo) {
                document.getElementById('modalImageSrc').src = bill.photo; 
                document.getElementById('imageModal').style.display = 'flex';
            }
        };

        function setupImageUpload(inputId, previewId, callback) { 
            document.getElementById(inputId)?.addEventListener('change', function(e) { 
                const file = e.target.files[0]; 
                if (!file) return; 
                const reader = new FileReader(); 
                reader.onload = function(event) { 
                    const img = new Image(); 
                    img.onload = function() { 
                        const canvas = document.createElement('canvas'); 
                        const MAX_WIDTH = 800; 
                        const scaleSize = MAX_WIDTH / img.width; 
                        canvas.width = MAX_WIDTH; 
                        canvas.height = img.height * scaleSize; 
                        const ctx = canvas.getContext('2d'); 
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height); 
                        const compData = canvas.toDataURL('image/jpeg', 0.6); 
                        document.getElementById(previewId).src = compData; 
                        document.getElementById(previewId).style.display = 'block'; 
                        callback(compData); 
                    }; 
                    img.src = event.target.result; 
                }; 
                reader.readAsDataURL(file); 
            }); 
        }
        let billImgData = null; 
        setupImageUpload('billPhoto', 'billPreview', data => billImgData = data);

        // ================= GST BILL FORM LOGIC =================
        window.gstItems = [];
        window.currentViewingBillId = ""; 
        window.currentGrandTotal = 0; 
        
        window.scaleInvoice = function() {
            const wrapper = document.getElementById('gst_previewWrapper'); 
            const invoice = document.getElementById('invoiceArea');
            if(!wrapper || !invoice) return; 
            const wrapperWidth = wrapper.clientWidth;
            if (wrapperWidth > 0 && wrapperWidth < 814) { 
                const scale = (wrapperWidth - 20) / 794; 
                invoice.style.transform = `scale(${scale})`; 
                wrapper.style.height = (1123 * scale + 40) + 'px';
            } else { 
                invoice.style.transform = 'scale(1)'; 
                wrapper.style.height = '1163px'; 
            }
        };
        
        window.addEventListener('resize', scaleInvoice); 
        window.addEventListener('load', scaleInvoice);
        if(document.getElementById('gst_cDate')) document.getElementById('gst_cDate').valueAsDate = new Date();

        window.updateGstUI = function() {
            document.getElementById('gst_outName').innerText = document.getElementById('gst_cName').value || 'Customer Name';
            let addr = document.getElementById('gst_cAddress').value.trim(); 
            document.getElementById('gst_boxAddress').style.display = addr ? 'block' : 'none'; 
            document.getElementById('gst_outAddress').innerText = addr;
            let mob = document.getElementById('gst_cMobile').value.trim(); 
            document.getElementById('gst_boxMobile').style.display = mob ? 'block' : 'none'; 
            document.getElementById('gst_outMobile').innerText = mob;
            let gst = document.getElementById('gst_cGST').value.trim().toUpperCase(); 
            document.getElementById('gst_boxGST').style.display = gst ? 'block' : 'none'; 
            document.getElementById('gst_outGST').innerText = gst;
            let d = document.getElementById('gst_cDate').value; 
            document.getElementById('gst_outDate').innerText = d ? new Date(d).toLocaleDateString('en-IN') : '';
        };

        // NEW SMART UPGRADE: Auto Fill Price from Stock
        window.autoFillGstPrice = function() {
            let val = document.getElementById('gst_iName').value.trim();
            let stockItem = globalRealStock.find(stock => stock.modelName.toUpperCase() === val.toUpperCase());
            if(stockItem) {
                document.getElementById('gst_iRate').value = stockItem.rate;
            }
        };

        window.addGstItem = function() {
            const name = document.getElementById('gst_iName').value.trim(); 
            const hsn = document.getElementById('gst_iHSN').value.trim() || ''; 
            const qty = Number(document.getElementById('gst_iQty').value); 
            const incRate = Number(document.getElementById('gst_iRate').value);
            
            if(!name || qty <= 0 || incRate <= 0) { alert("⚠️ Please enter Item Name, valid Qty, and Final Rate."); return; }
            
            const baseRate = incRate / 1.18; 
            const baseAmount = baseRate * qty;
            window.gstItems.push({ name, hsn, qty, incRate, baseRate, baseAmount });
            
            document.getElementById('gst_iName').value = ''; 
            document.getElementById('gst_iHSN').value = ''; 
            document.getElementById('gst_iQty').value = '1'; 
            document.getElementById('gst_iRate').value = ''; 
            document.getElementById('gst_iName').focus(); 
            
            window.renderGstCalculations();
        };

        window.removeGstItem = function(index) { 
            window.gstItems.splice(index, 1); 
            window.renderGstCalculations(); 
        };

        window.calculateGstDue = function() {
            let jama = Number(document.getElementById('gst_amtPaid').value) || 0;
            let baki = window.currentGrandTotal - jama;
            document.getElementById('gst_amtDue').value = baki;
        };

        window.renderGstCalculations = function() {
            const sumTable = document.getElementById('gst_summaryTable'); 
            const sumBody = document.getElementById('gst_summaryBody'); 
            sumBody.innerHTML = '';
            
            if(window.gstItems.length === 0) sumTable.style.display = 'none'; 
            else { 
                sumTable.style.display = 'table'; 
                window.gstItems.forEach((item, index) => { 
                    sumBody.innerHTML += `<tr><td>${item.name}</td><td>${item.qty}</td><td>₹${item.incRate.toFixed(2)}</td><td><button class="btn-del" onclick="removeGstItem(${index})">X</button></td></tr>`; 
                }); 
            }
            
            let html = ''; 
            let totalBaseAmount = 0; 
            let hsnGroups = {}; 
            
            window.gstItems.forEach((item, index) => {
                totalBaseAmount += item.baseAmount;
                html += `<tr><td class="text-center">${index + 1}</td><td class="bold">${item.name}</td><td class="text-center">${item.hsn}</td><td class="text-center">${item.qty}</td><td class="text-right">${item.incRate.toFixed(2)}</td><td class="text-right">${item.baseRate.toFixed(2)}</td><td class="text-right">${item.baseAmount.toFixed(2)}</td></tr>`;
                let key = item.hsn || '-'; 
                if(!hsnGroups[key]) hsnGroups[key] = 0; 
                hsnGroups[key] += item.baseAmount;
            });
            
            html += `<tr class="filler-row"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
            document.getElementById('gst_outItemsList').innerHTML = html;
            
            const cgst = totalBaseAmount * 0.09; 
            const sgst = totalBaseAmount * 0.09; 
            const grandTotalExact = totalBaseAmount + cgst + sgst; 
            const grandTotalRounded = Math.round(grandTotalExact); 
            const roundOff = grandTotalRounded - grandTotalExact;
            
            window.currentGrandTotal = grandTotalRounded; 
            window.calculateGstDue(); 
            
            document.getElementById('gst_outCGST').innerText = cgst.toFixed(2); 
            document.getElementById('gst_outSGST').innerText = sgst.toFixed(2);
            
            let roundText = roundOff.toFixed(2); 
            if(roundOff > 0) roundText = "(+)" + roundText; 
            else if(roundOff < 0) roundText = "(-)" + Math.abs(roundOff).toFixed(2);
            
            document.getElementById('gst_outRound').innerText = roundText; 
            document.getElementById('gst_outTotal').innerText = '₹ ' + grandTotalRounded.toLocaleString('en-IN') + '.00'; 
            document.getElementById('gst_outWords').innerText = 'Indian Rupees ' + window.numToWords(grandTotalRounded) + ' Only';

            let taxHtml = ''; 
            let tTaxable = 0; let tCgst = 0; let tSgst = 0; let tTotalTax = 0;
            
            for(let hsn in hsnGroups) {
                let val = hsnGroups[hsn]; 
                let c = val * 0.09; let s = val * 0.09; let tot = c + s; 
                tTaxable += val; tCgst += c; tSgst += s; tTotalTax += tot;
                taxHtml += `<tr><td class="text-center" style="border-left:none; padding:4px;">${hsn}</td><td class="text-right" style="padding:4px;">${val.toFixed(2)}</td><td class="text-center" style="padding:4px;">9%</td><td class="text-right" style="padding:4px;">${c.toFixed(2)}</td><td class="text-center" style="padding:4px;">9%</td><td class="text-right" style="padding:4px;">${s.toFixed(2)}</td><td class="text-right" style="border-right:none; padding:4px;">${tot.toFixed(2)}</td></tr>`;
            }
            
            document.getElementById('gst_taxSummaryList').innerHTML = taxHtml; 
            document.getElementById('gst_tsTotalTaxable').innerText = tTaxable.toFixed(2); 
            document.getElementById('gst_tsTotalCGST').innerText = tCgst.toFixed(2); 
            document.getElementById('gst_tsTotalSGST').innerText = tSgst.toFixed(2); 
            document.getElementById('gst_tsTotalTax').innerText = tTotalTax.toFixed(2);
            document.getElementById('gst_outTaxWords').innerText = 'Indian Rupees ' + window.numToWords(Math.round(tTotalTax)) + ' Only';
        };

        window.numToWords = function(num) {
            if(num === 0) return "Zero"; 
            const a = ['','One ','Two ','Three ','Four ', 'Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen ']; 
            const b = ['', '', 'Twenty','Thirty','Forty','Fifty', 'Sixty','Seventy','Eighty','Ninety'];
            if ((num = num.toString()).length > 9) return 'Amount too large'; 
            let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/); 
            if (!n) return; let str = '';
            str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : ''; 
            str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : ''; 
            str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : ''; 
            str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : ''; 
            str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : ''; 
            return str.trim();
        };

        // ================= GST MEMO & CUSTOMER KHATA AUTO-UPDATE =================
        let globalGstInvoices = []; 
        let currentBillNumber = "SE/26-27/001";
        
        let customerList = []; 
        const custRef = doc(db, "app_settings", "customers");
        onSnapshot(custRef, (docSnap) => { 
            if (docSnap.exists() && docSnap.data().list) customerList = docSnap.data().list; 
            else setDoc(custRef, { list: customerList }); 
            if(window.updateKhataSelects) window.updateKhataSelects();
        });

        onSnapshot(query(collection(db, "gst_invoices")), (snap) => {
            const list = document.getElementById('memoList'); 
            let tempA = []; let totalSales = 0; let todaySales = 0; 
            let todayStr = new Date().toISOString().split('T')[0];
            
            snap.forEach(doc => { 
                let d = doc.data(); d.id = doc.id; tempA.push(d); 
                totalSales += (d.grandTotal || 0); 
                if(d.date === todayStr) todaySales += (d.grandTotal || 0); 
            });
            
            currentBillNumber = "SE/26-27/" + String(snap.size + 1).padStart(3, '0');
            if(document.getElementById('gst_invNo') && document.getElementById('gstFormSection').style.display !== 'none') {
                document.getElementById('gst_invNo').innerText = currentBillNumber;
            }

            if(document.getElementById('memoTotalSales')) document.getElementById('memoTotalSales').innerText = "₹" + totalSales.toLocaleString('en-IN');
            if(document.getElementById('memoTodaySales')) document.getElementById('memoTodaySales').innerText = "₹" + todaySales.toLocaleString('en-IN');
            if(document.getElementById('dashMemoSalesHome')) document.getElementById('dashMemoSalesHome').innerText = "₹" + totalSales.toLocaleString('en-IN');

            tempA.sort((a,b) => (b.timestamp||0) - (a.timestamp||0)); 
            globalGstInvoices = tempA;

            if(list) {
                list.innerHTML = '';
                tempA.forEach(d => {
                    let dueBadge = d.due > 0 ? `<span style="color:var(--ios-red); font-size:12px; margin-left:10px;">Due: ₹${d.due}</span>` : `<span style="color:var(--ios-green); font-size:12px; margin-left:10px;">Paid</span>`;
                    list.innerHTML += `<div class="record-item m-item" data-search="${d.cName.toLowerCase()} ${d.billNo.toLowerCase()}">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="product-title">${d.cName}</div>
                            <div style="font-weight:700; color:var(--ios-green);">₹${(d.grandTotal||0).toLocaleString('en-IN')}<br>${dueBadge}</div>
                        </div>
                        <div class="data-row">
                            <span>Bill: <strong>${d.billNo}</strong></span>
                            <span>📅 ${new Date(d.date).toLocaleDateString('en-IN')}</span>
                        </div>
                        <div style="margin-top:10px; display:flex; gap:8px; justify-content:space-between; align-items:center;">
                            <button onclick="viewPastBill('${d.id}')" class="btn-edit" style="flex:1; padding:6px; background:var(--ios-blue); color:white;">👁️ View</button>
                            <button onclick="printDirectPdf('${d.id}')" class="btn-edit" style="flex:1; padding:6px; background:var(--ios-green); color:white;">🖨️ PDF</button>
                            <button onclick="deleteGstBill('${d.id}')" class="btn-destructive" style="padding:6px 12px;">🗑️ Delete</button>
                        </div>
                    </div>`;
                });
                if(snap.empty) list.innerHTML = '<div class="loading-text" style="padding:15px; color:gray;">No saved invoices found.</div>';
            }
        });

        window.filterMemos = function() { 
            let val = document.getElementById('memoSearch').value.toLowerCase(); 
            document.querySelectorAll('.m-item').forEach(el => { 
                el.style.display = el.dataset.search.includes(val) ? '' : 'none'; 
            }); 
        };
        
        window.deleteGstBill = async function(id) { 
            if(!confirm("⚠️ Kya aap sach mein is GST Bill ko delete karna chahte hain? \n\nIska Udhar aur Jama record bhi Khata se permanently delete ho jayega!")) return;
            
            let bill = globalGstInvoices.find(x => x.id === id);
            if(bill) {
                let bNo = bill.billNo;
                await deleteDoc(doc(db, "gst_invoices", id));
                
                const qBills = query(collection(db, "cust_khata_bills"), where("billNo", "==", bNo));
                const snapBills = await getDocs(qBills);
                snapBills.forEach(async (d) => { await deleteDoc(doc(db, "cust_khata_bills", d.id)); });

                const qPays = query(collection(db, "cust_khata_payments"), where("customer", "==", bill.cName));
                const snapPays = await getDocs(qPays);
                snapPays.forEach(async (d) => { 
                    if(d.data().remarks && d.data().remarks.includes(bNo)) {
                        await deleteDoc(doc(db, "cust_khata_payments", d.id)); 
                    }
                });
                alert("✅ Bill aur uska Khata record successfully delete ho gaya.");
            }
        };

        window.saveGSTBillToDB = async function() {
            if(window.gstItems.length === 0) return false;
            const rawName = document.getElementById('gst_cName').value.trim(); 
            if(!rawName) return false;
            const name = rawName.toUpperCase();
            
            let totalBase = 0; 
            window.gstItems.forEach(i => totalBase += i.baseAmount);
            
            const cgst = totalBase * 0.09; 
            const sgst = totalBase * 0.09; 
            const grandTotal = Math.round(totalBase + cgst + sgst); 
            const roundOff = grandTotal - (totalBase + cgst + sgst);
            
            const amtPaid = Number(document.getElementById('gst_amtPaid').value) || 0;
            const amtDue = grandTotal - amtPaid;
            const billDate = document.getElementById('gst_cDate').value;
            const mobileNo = document.getElementById('gst_cMobile').value.trim();
            const ts = Date.now();
            
            const billData = { 
                billNo: currentBillNumber, cName: name, cMobile: mobileNo, 
                cAddress: document.getElementById('gst_cAddress').value.trim(), 
                cGST: document.getElementById('gst_cGST').value.trim().toUpperCase(), 
                date: billDate, items: window.gstItems, 
                totalBase, cgst, sgst, roundOff, grandTotal, 
                paid: amtPaid, due: amtDue, timestamp: ts 
            };
            
            try { 
                await addDoc(collection(db, "gst_invoices"), billData); 

                // --- NEW SMART UPGRADE: AUTO INVENTORY DEDUCTION ---
                for (let i = 0; i < window.gstItems.length; i++) {
                    let billedItem = window.gstItems[i];
                    let stockItem = globalRealStock.find(stock => stock.modelName.toUpperCase() === billedItem.name.toUpperCase());
                    
                    if(stockItem) {
                        let updatedQty = (stockItem.qty || 0) - billedItem.qty;
                        if(updatedQty < 0) updatedQty = 0;
                        await updateDoc(doc(db, "real_inventory", stockItem.id), { 
                            qty: updatedQty, 
                            updatedAt: Date.now() 
                        });
                    }
                }
                
                if(!customerList.includes(name)) {
                    customerList.push(name);
                    await setDoc(custRef, { list: customerList });
                }
                
                if(grandTotal > 0) {
                    await addDoc(collection(db, "cust_khata_bills"), {
                        customer: name, date: billDate, amount: grandTotal, billNo: currentBillNumber, timestamp: ts
                    });
                }
                
                if(amtPaid > 0) {
                    await addDoc(collection(db, "cust_khata_payments"), {
                        customer: name, date: billDate, amount: amtPaid, mode: "Bill Jama", remarks: "For Bill: " + currentBillNumber, timestamp: ts + 1
                    });
                }

                window.gstItems = []; 
                document.getElementById('gst_cName').value = ''; 
                document.getElementById('gst_cMobile').value = ''; 
                document.getElementById('gst_cAddress').value = ''; 
                document.getElementById('gst_cGST').value = ''; 
                document.getElementById('gst_amtPaid').value = '';
                document.getElementById('gst_amtDue').value = '0';
                window.updateGstUI(); 
                window.renderGstCalculations(); 
                return true; 
            } catch(e) { 
                alert("Error saving bill"); return false; 
            }
        };

        window.saveAndPrintGST = function() {
            if(window.gstItems.length === 0) { alert("⚠️ Bill is empty!"); return; }
            if(!document.getElementById('gst_cName').value.trim()) { alert("⚠️ Customer Name is required!"); return; }
            
            document.body.className = 'print-gst';
            document.getElementById('invoiceArea').style.transform = 'scale(1)'; 
            window.print(); 
            
            setTimeout(async () => { 
                let success = await saveGSTBillToDB(); 
                if(success) console.log("✅ Bill & Khata Auto-Saved!"); 
            }, 100);
        };
        
        window.saveAndWhatsAppGST = async function() {
            if(window.gstItems.length === 0) { alert("⚠️ Bill is empty!"); return; }
            const mobile = document.getElementById('gst_cMobile').value; 
            if(!mobile || mobile.length !== 10) { alert("⚠️ Valid 10-digit mobile number needed for WhatsApp."); return; }
            
            let total = document.getElementById('gst_outTotal').innerText; 
            let name = document.getElementById('gst_cName').value;
            let success = await saveGSTBillToDB();
            
            if(success) { 
                let msg = `*SAVITRI ELECTRONICS AND FURNITURE*\n\nHello ${name},\nYour Tax Invoice for ${total} has been generated.\n\nPlease find the attached PDF bill for your records.\nThank you for choosing us!`; 
                window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(msg)}`, '_blank'); 
            }
        };

        window.printDirectPdf = function(id) {
            let b = globalGstInvoices.find(x => x.id === id); 
            if(!b) return;
            
            document.getElementById('gst_outName').innerText = b.cName;
            document.getElementById('gst_outMobile').innerText = b.cMobile || ''; 
            document.getElementById('gst_boxMobile').style.display = b.cMobile ? 'block' : 'none';
            document.getElementById('gst_outAddress').innerText = b.cAddress || ''; 
            document.getElementById('gst_boxAddress').style.display = b.cAddress ? 'block' : 'none';
            document.getElementById('gst_outGST').innerText = b.cGST || ''; 
            document.getElementById('gst_boxGST').style.display = b.cGST ? 'block' : 'none';
            document.getElementById('gst_invNo').innerText = b.billNo; 
            document.getElementById('gst_outDate').innerText = new Date(b.date).toLocaleDateString('en-IN');
            
            let html = ''; let hsnGroups = {};
            b.items.forEach((item, index) => {
                html += `<tr><td class="text-center">${index + 1}</td><td class="bold">${item.name}</td><td class="text-center">${item.hsn}</td><td class="text-center">${item.qty}</td><td class="text-right">${item.incRate.toFixed(2)}</td><td class="text-right">${item.baseRate.toFixed(2)}</td><td class="text-right">${item.baseAmount.toFixed(2)}</td></tr>`;
                let key = item.hsn || '-'; 
                if(!hsnGroups[key]) hsnGroups[key] = 0; 
                hsnGroups[key] += item.baseAmount;
            });
            html += `<tr class="filler-row"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
            document.getElementById('gst_outItemsList').innerHTML = html;

            document.getElementById('gst_outCGST').innerText = b.cgst.toFixed(2);

            }
            document.getElementById('vk_itemsList').innerHTML = itemsHtml;
            
            document.getElementById('vk_total').innerText = '₹ ' + (bill.grandTotal || 0).toLocaleString('en-IN');
            document.getElementById('vk_paid').innerText = '₹ ' + (bill.paid || 0).toLocaleString('en-IN');
            document.getElementById('vk_due').innerText = '₹ ' + (bill.due || 0).toLocaleString('en-IN');
            
            document.getElementById('viewKhataBillModal').style.display = 'block';
        };

        window.closeKhataBillModal = function() {
            document.getElementById('viewKhataBillModal').style.display = 'none';
        };

    </script>
</body>
</html>
